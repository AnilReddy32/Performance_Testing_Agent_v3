[project]
name = "performance-testing-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lynda-Rita", email = "lynda.rita@hcltech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
performance-testing-ai-agent = "performance_testing_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
