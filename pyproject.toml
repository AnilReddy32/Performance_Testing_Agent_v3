[project]
name = "performance-testing-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lynda-Rita", email = "lynda.rita@hcltech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-adk>=2.0.0",
    "litellm>=1.55.0",
    "openai>=1.60.0",
    "httpx>=0.28.1",
    "mcp>2.0.0",  # monitoring_agent's MCP server uses the v1 FastMCP API (mcp.server.fastmcp.FastMCP), which was renamed/removed in mcp 2.x
    "numpy>=2.5.1",
    "openpyxl>=3.1.0",
    "pandas>=3.0.5",
    "psutil>=7.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.1",
    "truststore>=0.10.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
performance-testing-ai-agent = "Performance_Testing_Agent:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
